<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Quillora</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="img/logo.png" alt="Quillora">
        <span class="logo-text">Quill<strong>ora</strong></span>
      </a>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Create your account ✨</h1>
      <p class="sub">Join Quillora — save your favorite articles and never miss a story.</p>
      <div class="alert" id="authError"></div>
      <form id="registerForm">
        <div class="form-field">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" required minlength="2" autocomplete="name">
        </div>
        <div class="form-field">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" required autocomplete="email">
        </div>
        <div class="form-field">
          <label for="regPass">Password</label>
          <input type="password" id="regPass" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-field">
          <label for="regPass2">Confirm Password</label>
          <input type="password" id="regPass2" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn primary">Create Account</button>
      </form>

      <div class="divider">— or —</div>
      <button type="button" class="btn google-btn" id="googleRegisterBtn">
        <svg width="18" height="18" viewBox="0 0 48 48" style="vertical-align:middle; margin-right:8px;">
          <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.7-.4-3.9z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.6 39.6 16.3 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.7-.4-3.9z"/>
        </svg>
        Sign up with Google
      </button>

      <p class="auth-alt">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>

  <script type="module" src="js/shared.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
