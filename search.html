<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search | Quillora</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="img/logo.png" alt="Quillora">
        <span class="logo-text">Quill<strong>ora</strong></span>
      </a>
      <nav class="main-nav"><a href="index.html">Home</a><a href="contact.html">About</a></nav>
      <div class="header-actions">
        <form class="search-box" action="search.html" method="get">
          <input type="search" name="q" placeholder="Search…"><button type="submit">🔍</button>
        </form>
        <div id="authArea" class="auth-area"></div>
      </div>
    </div>
  </header>

  <main class="container main-content">
    <section class="section">
      <div class="section-head">
        <h2>🔍 Search Results: <span id="searchTerm"></span></h2>
      </div>
      <div class="article-grid" id="searchResults"><div class="loading">Searching…</div></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom"><p>© <span id="year"></span> Quillora</p></div>
  </footer>

  <script type="module" src="js/shared.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
